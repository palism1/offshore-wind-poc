[project]
name = "owr"
version = "0.1.0"
description = "Offshore Wind Reserve scenario-simulation tool (ISO-NE / Boston POC) — Software & Infrastructure Lead deliverables"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# ETL / DB / API dependencies land in later phases (Phase 2+). The Phase 3
# simulation engine is intentionally pure-Python with no third-party runtime deps
# so it stays fully testable offline, before any ISO-NE/EIA credentials exist.
etl = [
    "gridstatus>=0.30",
    "psycopg[binary]>=3.1",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
